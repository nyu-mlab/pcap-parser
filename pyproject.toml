[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap-extract"
version = "0.1.0"
description = "Parse pcap files and extract flow-related information"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "NYU mLab"},
]
keywords = ["pcap", "network", "tshark", "wireshark", "flow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "pandas",
    "tldextract",
]

[project.urls]
Homepage = "https://github.com/nyu-mlab/pcap-parser"
Repository = "https://github.com/nyu-mlab/pcap-parser"
Issues = "https://github.com/nyu-mlab/pcap-parser/issues"

[project.scripts]
pcap-parse = "pcap_parser.parse:main"
pcap-flow = "pcap_parser.flow:main"
pcap-devices = "pcap_parser.devices:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "build",
]
